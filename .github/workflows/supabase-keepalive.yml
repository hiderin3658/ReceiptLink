# Supabase Free プランの Auto-pause (7 日間アクセスなしで一時停止) を回避するためのキープアライブ。
#
# Vercel Cron (web/vercel.json の /api/cron/keepalive) とは独立して動作し、
# GitHub Actions から直接 Supabase REST API に軽量クエリを投げて DB アクティビティを発生させる。
# Vercel 側の cron や CRON_SECRET の設定状態に依存しないため、保険・冗長化として機能する。
#
# ── 必要な GitHub Secrets ────────────────────────────────────────────────
#   リポジトリ → Settings → Secrets and variables → Actions → New repository secret
#     - SUPABASE_URL              : プロジェクト URL 例) https://xxxxxxxxxxxx.supabase.co
#     - SUPABASE_SERVICE_ROLE_KEY : service_role キー (RLS をバイパスしクエリ成功を担保)
#
# ── 注意 ──────────────────────────────────────────────────────────────────
#   - schedule はデフォルトブランチ (main) に存在しないと発火しない。必ず main にマージすること。
#   - GitHub は 60 日間リポジトリ活動 (＝コミット) が無いと schedule を自動停止する。
#     本ワークフロー自身の実行では 60 日タイマーはリセットされないため、
#     keep-workflows-alive.yml が定期的にコミットを作って停止を防いでいる。
#   - 手動実行: Actions タブ → "Supabase Keepalive" → Run workflow
#     (Supabase の 7 日 Auto-pause タイマーはリセットされるが、上記 60 日タイマーには影響しない)

name: Supabase Keepalive

on:
  schedule:
    # UTC 00:00 と 12:00 の 1 日 2 回 (JST 09:00 / 21:00)。
    # GitHub の schedule は混雑時に遅延・スキップされ得るため、7 日の猶予に対し余裕を持って 2 回/日 実行する。
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

# 重複起動を抑止
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase へ軽量クエリを送信して Auto-pause を回避
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL または SUPABASE_SERVICE_ROLE_KEY が未設定です。リポジトリの Secrets を確認してください。"
            exit 1
          fi

          # 軽量クエリ。expense_categories は標準カテゴリが必ず存在する参照テーブル。
          # service_role キーで RLS をバイパスし、クエリが確実に DB へ届くようにする。
          http_status=$(curl -sS -o /tmp/keepalive_resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/expense_categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "HTTP status: ${http_status}"

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Supabase へのクエリが失敗しました (HTTP ${http_status})。"
            cat /tmp/keepalive_resp.txt
            exit 1
          fi

          echo "✅ Supabase keepalive 成功 (HTTP ${http_status})"
